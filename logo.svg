<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Food Storage: a #10 can with a water drop, on the app's green -->
  <rect width="120" height="120" rx="26" fill="#2f6f4f"/>
  <!-- can body -->
  <path d="M30 36 v50 a22 7 0 0 0 44 0 v-50 z" fill="#ffffff"/>
