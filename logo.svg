  <ellipse cx="52" cy="36" rx="22" ry="7" fill="#e4e0d6"/>
  <ellipse cx="52" cy="36" rx="17" ry="4.5" fill="#cfc9bb"/>
  <path d="M30 52 a22 7 0 0 0 44 0" fill="none" stroke="#e4e0d6" stroke-width="3"/>
  <path d="M30 70 a22 7 0 0 0 44 0" fill="none" stroke="#e4e0d6" stroke-width="3"/>
  <!-- label band -->
  <path d="M30 56 a22 7 0 0 0 44 0 v10 a22 7 0 0 1 -44 0 z" fill="#d9a441"/>
  <!-- water drop -->
  <path d="M86 52 C86 52 72 70 72 79 a14 14 0 0 0 28 0 C100 70 86 52 86 52 z" fill="#4a90c8" stroke="#2f6f4f" stroke-width="4" stroke-linejoin="round"/>
